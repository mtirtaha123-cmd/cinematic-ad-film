
name: Iran Pardaz Cinematic Ad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p output

      - name: Check logo
        run: |
          test -f iran-pardaz.png || {
            echo "ERROR: iran-pardaz.png is missing"
            exit 1
          }

      - name: Render cinematic advertisement
        run: |
          ffmpeg -y \
            -loop 1 \
            -framerate 24 \
            -i iran-pardaz.png \
            -f lavfi \
            -i "aevalsrc=0.05*sin(2*PI*55*t)+0.025*sin(2*PI*82.41*t)+0.015*sin(2*PI*110*t)+0.008*sin(2*PI*164.81*t):s=44100:d=300" \
            -filter_complex \
            "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=0x080808,zoompan=z='min(zoom+0.000025,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=7200:s=1280x720:fps=24,eq=contrast=1.08:saturation=1.18,drawbox=x='mod(t*420,1280)':y=0:w=5:h=720:color=0xFFD36A@0.25:t=fill,fade=t=in:st=0:d=3,fade=t=out:st=295:d=5,format=yuv420p[v];[1:a]lowpass=f=1200,volume=0.7,afade=t=in:st=0:d=4,afade=t=out:st=295:d=5[a]" \
            -map "[v]" \
            -map "[a]" \
            -t 300 \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/iran-pardaz-ad.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: Iran-Pardaz-Cinematic-Advertisement
          path: output/iran-pardaz-ad.mp4
          retention-days: 7
